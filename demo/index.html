<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' https://tile.openstreetmap.org; connect-src https://nominatim.openstreetmap.org https://overpass-api.de https://router.project-osrm.org https://www.datos.gov.co; base-uri 'none'; form-action 'none'; require-trusted-types-for 'script'; trusted-types 'none'; upgrade-insecure-requests">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>Supplier Scout · búsqueda de proveedores</title>
<meta name="description" content="Encuentra proveedores en varias capas: empresas nacionales que ya venden a entidades públicas (SECOP II), tus proveedores conocidos, negocios cercanos en el mapa y búsquedas listas en Google, Facebook y LinkedIn.">
<meta property="og:type" content="website">
<meta property="og:title" content="Supplier Scout · búsqueda de proveedores">
<meta property="og:description" content="Proveedores nacionales con datos públicos, tus proveedores con sus condiciones, negocios cercanos y búsquedas en internet, en una sola búsqueda.">
<meta property="og:url" content="https://dsergio909.github.io/supplier-scout/">
<meta property="og:image" content="https://dsergio909.github.io/supplier-scout/demo/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#main" data-i18n="skip"></a>
<header class="bar">
  <div class="bar-left">
    <span class="app-name">Supplier Scout</span>
    <span class="bar-sep" aria-hidden="true"></span>
    <span class="app-module" data-i18n="module"></span>
  </div>
  <nav class="views" aria-label="Secciones" data-i18n-label="sections">
    <a href="#buscar" data-view="search" data-i18n="viewSearch"></a>
    <a href="#lista" data-view="list"><span data-i18n="viewList"></span> <span class="badge" id="listBadge"></span></a>
  </nav>
  <div class="bar-right">
    <a id="howLink" href="https://github.com/Dsergio909/supplier-scout/blob/main/docs/como-funciona.md" data-i18n="how"></a>
    <div class="lang" role="group" aria-label="Idioma / Language">
      <button type="button" data-lang="es">ES</button><button type="button" data-lang="en">EN</button><button type="button" data-lang="pt">PT</button><button type="button" data-lang="fr">FR</button>
    </div>
  </div>
</header>

<main id="main">
  <!-- Buscar -->
  <section class="view" id="view-search" aria-labelledby="searchTitle">
    <h1 class="sr-only" id="searchTitle" data-i18n="viewSearch"></h1>
    <form class="search-card" id="searchForm" novalidate>
      <div class="fields">
        <label class="f grow"><span data-i18n="what"></span><input id="what" type="search" autocomplete="off" maxlength="120"></label>
        <label class="f"><span class="f-row"><span data-i18n="place"></span> <button type="button" class="link-btn small" id="nearMe" data-i18n="nearMe"></button></span><input id="place" type="search" autocomplete="off" maxlength="120"></label>
        <label class="f"><span data-i18n="country"></span><select id="country"></select></label>
        <button type="submit" class="btn primary go" id="go" data-i18n="search"></button>
      </div>
      <p class="examples"><span data-i18n="tryLabel"></span> <span id="examples"></span></p>
    </form>
    <div class="status" id="status" role="status" aria-live="polite"></div>
    <div id="results"></div>
  </section>

  <!-- Mi lista -->
  <section class="view" id="view-list" aria-labelledby="listTitle" hidden>
    <div class="page-head">
      <div>
        <h1 id="listTitle" data-i18n="viewList"></h1>
        <p class="sub" data-i18n="listSub"></p>
      </div>
      <div class="actions">
        <button type="button" class="btn primary" id="addSupplier" data-i18n="addSupplier"></button>
        <button type="button" class="btn" id="askQuotes" data-i18n="askQuotes"></button>
        <button type="button" class="btn" id="exportCsv" data-i18n="exportCsv"></button>
      </div>
    </div>
    <div class="goals" id="goals"></div>
    <div class="filters"><div class="chips" role="group" id="catChips"></div></div>
    <div class="table-wrap" tabindex="0" role="region" aria-label="Lista" id="listWrap">
      <table class="grid list-table">
        <thead><tr>
          <th scope="col" data-i18n="colSupplier"></th>
          <th scope="col" data-i18n="colCategories"></th>
          <th scope="col" data-i18n="colContact"></th>
          <th scope="col" data-i18n="colTerms"></th>
          <th scope="col" data-i18n="colStatus"></th>
          <th scope="col"><span class="sr-only" data-i18n="colActions"></span></th>
        </tr></thead>
        <tbody id="listRows"></tbody>
      </table>
    </div>
    <p class="verify" id="verify"></p>
    <p class="clear-row"><button type="button" class="link-btn danger" id="clearList" data-i18n="clearList"></button></p>
  </section>
</main>

<dialog class="sheet" id="editor" aria-labelledby="editorTitle">
  <form method="dialog" id="editorForm" novalidate>
    <header class="sheet-head"><h2 id="editorTitle"></h2><button type="button" class="link-btn" id="editorClose" data-i18n="close"></button></header>
    <div class="sheet-body">
      <div class="paste">
        <label for="pasteText" data-i18n="pasteLabel"></label>
        <textarea id="pasteText" rows="3" maxlength="5000"></textarea>
        <p class="paste-row"><button type="button" class="btn" id="pasteFill" data-i18n="pasteBtn"></button> <span class="note" id="pasteNote" aria-live="polite"></span></p>
      </div>
      <div class="form-grid">
        <label class="f span2"><span data-i18n="fName"></span><input id="eName" maxlength="120" required></label>
        <fieldset class="f span2 cats"><legend data-i18n="fCategories"></legend><div id="eCats"></div></fieldset>
        <label class="f"><span data-i18n="fPersonType"></span><select id="ePersonType"></select></label>
        <label class="f"><span data-i18n="fNit"></span><input id="eNit" inputmode="numeric" maxlength="15"></label>
        <label class="f"><span data-i18n="fCoverage"></span><select id="eCoverage"></select></label>
        <label class="f"><span data-i18n="fCity"></span><input id="eCity" maxlength="80"></label>
        <label class="f"><span data-i18n="fPhone"></span><input id="ePhone" inputmode="tel" maxlength="25"></label>
        <label class="f"><span data-i18n="fEmail"></span><input id="eEmail" type="email" maxlength="120"></label>
        <label class="f"><span data-i18n="fWebsite"></span><input id="eWebsite" maxlength="200" placeholder="https://"></label>
        <label class="f"><span data-i18n="fCredit"></span><input id="eCredit" type="number" min="0" max="365" step="1"></label>
        <label class="f"><span data-i18n="fPayment"></span><select id="ePayment"></select></label>
        <label class="f"><span data-i18n="fDelivery"></span><select id="eDelivery"></select></label>
        <label class="f check"><input id="eInvoice" type="checkbox"> <span data-i18n="fEInvoice"></span></label>
        <label class="f"><span data-i18n="fPrice"></span><input id="ePrice" maxlength="60"></label>
        <label class="f"><span data-i18n="fLead"></span><input id="eLead" maxlength="60"></label>
        <label class="f"><span data-i18n="fStatus"></span><select id="eStatus"></select></label>
        <label class="f span2"><span data-i18n="fNotes"></span><textarea id="eNotes" rows="2" maxlength="300"></textarea></label>
      </div>
      <p class="form-error" id="editorError" role="alert"></p>
    </div>
    <footer class="sheet-foot"><button type="submit" class="btn primary" id="editorSave" data-i18n="save"></button><button type="button" class="btn" id="editorCancel" data-i18n="cancel"></button></footer>
  </form>
</dialog>

<dialog class="sheet" id="quotes" aria-labelledby="quotesTitle">
  <header class="sheet-head"><h2 id="quotesTitle" data-i18n="quotesTitle"></h2><button type="button" class="link-btn" id="quotesClose" data-i18n="close"></button></header>
  <div class="sheet-body">
    <p class="sub" data-i18n="quotesSub"></p>
    <label class="f"><span data-i18n="quotesNeed"></span><input id="qNeed" maxlength="120"></label>
    <ul class="rfq" id="rfqList"></ul>
  </div>
</dialog>

<footer class="foot">
  <span data-i18n="footer"></span>
  <span class="foot-links"><a href="https://github.com/Dsergio909/supplier-scout" data-i18n="code"></a><a href="https://dsergio909.github.io/">Sergio García</a></span>
</footer>

<script src="../src/core/text.js"></script>
<script src="../src/core/countries.js"></script>
<script src="../src/core/categories.js"></script>
<script src="../src/core/osm.js"></script>
<script src="../src/core/services.js"></script>
<script src="../src/core/quotes.js"></script>
<script src="../src/core/capture.js"></script>
<script src="../src/core/csv.js"></script>
<script src="../src/core/shortlist.js"></script>
<script src="../src/core/outreach.js"></script>
<script src="../src/core/channels.js"></script>
<script src="../src/core/secop.js"></script>
<script src="i18n.js"></script>
<script src="live.js"></script>
<script src="map.js"></script>
<script src="app.js"></script>
</body>
</html>
