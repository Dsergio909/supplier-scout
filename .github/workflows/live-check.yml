name: Live check (real OpenStreetMap data)

# Run by hand only: it queries the real public services (Nominatim, Overpass,
# OSRM, the OSM API and map tiles) a few times, within their usage policies.
# Results and screenshots are pushed to the "live-check" branch.
on:
  workflow_dispatch:
    inputs:
      probe_only:
        description: Only probe the services (skip the searches and the browser)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: live-check
  cancel-in-progress: false

jobs:
  live-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - name: Probe each service once
        continue-on-error: true
        run: node tools/live-probe.js
      - name: Search the real services with the app's own code
        if: ${{ !inputs.probe_only }}
        continue-on-error: true
        run: node tools/live-check.js
      - name: Install a browser
        if: ${{ !inputs.probe_only }}
        run: |
          npm install --no-save --ignore-scripts playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Use the web app in a real browser
        if: ${{ !inputs.probe_only }}
        continue-on-error: true
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/dev/null 2>&1 &
          sleep 2
          node tools/live-browser.js http://127.0.0.1:8000/demo/
      - name: Publish results to the live-check branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p results
          cd results
          git init -q -b live-check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Live check $(date -u +%Y-%m-%dT%H:%M:%SZ) for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:live-check
